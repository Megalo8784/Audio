[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcripteur"
version = "0.1.0"
description = "Transcription locale d'appels (faster-whisper + pyannote) vers JSON"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1",
    "soundfile>=0.12",
    "numpy",
]

[project.optional-dependencies]
diarisation = ["pyannote.audio>=4.0"]
# DLL CUDA pour faster-whisper sous Windows (CTranslate2 4.x : CUDA 12 + cuDNN 9.10)
cuda = [
    "ctranslate2==4.8.3",  # embarque le chargeur cuDNN 9.10.2.21 : versions à garder alignées
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cudnn-cu12==9.10.2.21",
]
dev = ["pytest"]

[project.scripts]
transcrire = "transcripteur.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
