[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcripteur"
version = "0.1.0"
description = "Transcription locale d'appels (faster-whisper + pyannote) vers JSON"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1",
    "soundfile>=0.12",
    "numpy",
]

[project.optional-dependencies]
diarisation = ["pyannote.audio>=4.0"]
dev = ["pytest"]

[project.scripts]
transcrire = "transcripteur.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
